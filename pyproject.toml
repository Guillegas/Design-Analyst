[project]
name = "design-analyst"
version = "0.1.0"
description = "Worker de análisis de color para Tattoo Inkprep"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pillow>=10.3",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scikit-image>=0.24",
    "supabase>=2.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
